<style>
  /* The site's look for the editing screen. Only Sveltia's own colour, font and corner settings
     (its --sui-* variables) are changed here, so an update of Sveltia keeps working.
     "html:root" makes these win over Sveltia's own light settings. */
  html:root[data-theme] {
    --sui-base-hue: 40;                                   /* warm greys instead of blue-grey */
    --sui-font-family-default: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --sui-primary-accent-color: #cf2c98;                  /* the site's pink, as on its buttons */
    --sui-primary-accent-color-text: #b72486;
    --sui-primary-accent-color-light: #d9479f;
    --sui-primary-accent-color-dark: #b72486;
    --sui-primary-accent-color-inverted: #ffffff;
    --sui-focus-ring-color: #cf2c98;
    --sui-selected-background-color: #fcefc4;             /* soft Lumos yellow for the open item */
    --sui-hover-background-color: #fdf6e0;
    --sui-primary-background-color: #ffffff;              /* white work area, as on the site */
    --sui-secondary-background-color: #f7f5f0;            /* warm off-white side and top bars */
    --sui-tertiary-background-color: #efece5;
    --sui-tertiary-foreground-color: hsl(40 5% 40%);      /* small grey text, readable on the off-white */
    --sui-secondary-border-color: hsl(40 14% 88%);        /* lighter lines and English/Dutch bars */
    --sui-control-small-border-radius: 5px;
    --sui-control-medium-border-radius: 6px;
    --sui-control-large-border-radius: 7px;
  }
  ::selection { background: #ffe7a3; color: #141414; }

  /* "You are editing" bar: the site address of the open item, at the very top of the screen.
     The editing screen is moved down by the bar's height, so the bar never covers its buttons. */
  #lumos-bar {
    display: none; position: fixed; top: 0; left: 0; right: 0; z-index: 1;
    padding: 7px 16px; background: #fbf1d3; border-bottom: 1px solid hsl(40 30% 80%);
    font: 14px/1.45 "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif; color: #1f1b16;
  }
  body.lumos-bar-on #lumos-bar { display: block; }
  /* "contain: layout" makes the editing screen's own full-screen layers (the open form, its pop-ups)
     fit inside the moved-down area as well, instead of the whole window. */
  body.lumos-bar-on > .app-shell { top: var(--lumos-bar-h, 0px) !important; height: auto !important; contain: layout; }
  #lumos-bar .lb-label { font-weight: 700; margin-right: 6px; }
  #lumos-bar .lb-addr { display: inline-block; margin-right: 10px; overflow-wrap: anywhere; }
  #lumos-bar .lb-lang { font-size: 12px; color: hsl(40 5% 38%); margin-right: 4px; }
  #lumos-bar a { color: #b72486; font-weight: 500; text-decoration: underline; text-underline-offset: 2px; }
  #lumos-bar a:hover { color: #cf2c98; }
  #lumos-bar a:focus-visible { outline: 2px solid #cf2c98; outline-offset: 2px; border-radius: 3px; }
  #lumos-bar .lb-off { color: hsl(40 5% 30%); }
  #lumos-bar .lb-note { display: block; font-size: 12.5px; color: hsl(40 5% 36%); }
  /* New item: the file name it will get, then the page, then how to change the name. */
  #lumos-bar .lb-name { display: inline-block; margin-right: 14px; }
  #lumos-bar .lb-name b { font-weight: 700; overflow-wrap: anywhere; }
  #lumos-bar .lb-narrow { display: none; }
  @media (max-width: 767.98px) {
    /* Below this width the editing screen has no side buttons; the Slug panel is in the top menu. */
    #lumos-bar .lb-wide { display: none; }
    #lumos-bar .lb-narrow { display: inline; }
  }
  @media (max-width: 600px) {
    #lumos-bar { padding: 6px 12px; font-size: 13px; }
    #lumos-bar .lb-label { display: block; }
    #lumos-bar .lb-addr { display: block; }
    #lumos-bar .lb-name { display: block; }
    #lumos-bar .lb-name .lb-label, #lumos-bar .lb-page .lb-label { display: inline; }
    #lumos-bar .lb-page .lb-addr { display: inline-block; }
  }
</style>
<script>
  // Always the light look, also when the computer is set to dark mode.
  (function () {
    var root = document.documentElement;
    function light() { if (root.dataset.theme !== "light") root.dataset.theme = "light"; }
    new MutationObserver(light).observe(root, { attributes: true, attributeFilter: ["data-theme"] });
  })();
</script>

<script>
  // The "You are editing" bar. It reads only the address bar of the editing screen
  // (#/collections/<list>/entries/<item>, #/collections/<list>/new, #/collections/_singletons/entries/<file>)
  // and the table above, so it shows nothing on the overview and the lists, and saves nothing.
  (function () {
    var M = window.LUMOS_PAGES, bar = document.getElementById("lumos-bar"), shown = null;
    if (!M || !bar) return;
    // Links go to the site this editing screen is on (the test copy, the hidden copy or the live site).
    if (/^https?:/.test(location.origin)) M.base = location.origin;
    // Whether an event page exists right now: asked from the site itself, once per opened item.
    var pageState = {};
    function checkPage(path) {
      if (pageState[path]) return pageState[path];
      pageState[path] = "checking";
      fetch(M.base + path, { method: "HEAD", cache: "no-store" })
        .then(function (r) { pageState[path] = r.ok ? "on" : "off"; shown = null; update(); })
        .catch(function () { pageState[path] = "on"; shown = null; update(); });
      return "checking";
    }
    var SAVE_NOTE = "Boxes marked * must be filled in; all others may stay empty. After you click Save, the site shows the change in about 2 minutes.";
    var KEEP_NOTE = " The file name and page address stay the same if you change the title.";
    var DELETE_NOTE = " To delete this item: the ⋮ button at the top right, then Delete.";
    function esc(s) {
      return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; });
    }
    function slugify(s) {
      return s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
    }
    function field(path) {
      var el = document.querySelector('[data-key-path="' + path + '"] input');
      return el ? el.value.trim() : "";
    }
    function addresses(pair, link) {
      return ["en", "nl"].map(function (lang) {
        var p = pair[lang], full = M.base + p;
        var label = '<span class="lb-lang">' + (lang === "en" ? "English" : "Dutch") + "</span>";
        return '<span class="lb-addr">' + label + (link
          ? '<a href="' + esc(full) + '" target="_blank" rel="noopener" title="' + esc(full) + '">' + esc(p) + "</a>"
          : '<span class="lb-off">' + esc(p) + "</span>") + "</span>";
      }).join("");
    }
    // The name shown in the editing screen's own Slug panel (only there while the panel is open).
    function panelSlug() {
      var hs = document.querySelectorAll("section.panel h3");
      for (var i = 0; i < hs.length; i++) {
        if (hs[i].textContent.trim() !== "Slug") continue;
        var v = hs[i].closest("section.panel").querySelector('[role="textbox"]');
        return v ? v.textContent.trim() : "";
      }
      return "";
    }
    var custom = null, customRoute = null;
    // A new item: the file name it will get (and for events the page address), updated while typing.
    // If the owner changed the name in the Slug panel, that name is shown instead.
    function newItem(h, c) {
      var parts = c.new_slug.map(field), ready = parts.every(Boolean);
      var auto = ready ? slugify(parts.join("-")) : "", seen = panelSlug();
      if (h !== customRoute) { custom = null; customRoute = h; }
      if (seen && ready) custom = seen !== auto ? seen : null;
      var name = custom || auto, where = "";
      if (c.pattern && name) {
        where = '<span class="lb-page"><span class="lb-label">Page</span>' + addresses({
          en: c.pattern.en.replace("{slug}", name), nl: c.pattern.nl.replace("{slug}", name) }, false) + "</span>";
      } else if (c.all) {
        where = '<span class="lb-page"><span class="lb-label">Shows on</span>' + addresses(c.all, true) + "</span>";
      } else if (c.new_note) {
        where = '<span class="lb-note">' + esc(c.new_note) + "</span>";
      }
      return '<span class="lb-name"><span class="lb-label">Will be saved as</span>' +
        (name ? "<b>" + esc(name) + "</b>" : '<span class="lb-off">shown once you fill in ' + esc(c.slug_from) + ".</span>") +
        "</span>" + where +
        '<span class="lb-note">The name is made from ' + esc(c.slug_from) + ". To change it before saving, open " +
        '<span class="lb-wide">Slug (the anchor button on the right)</span>' +
        '<span class="lb-narrow">the ⋮ menu at the top, then Slug</span>. After saving it stays fixed.</span>' +
        '<span class="lb-note">' + esc(SAVE_NOTE) + "</span>";
    }
    function view() {
      var h = location.hash.replace(/^#/, "").split("?")[0];
      var m = h.match(/^\/collections\/([^\/]+)\/(?:entries\/(.+)|new)$/);
      var c = m && M.collections[m[1]];
      if (!c) return "";
      if (!m[2] && c.new_slug) return newItem(h, c);
      var slug = m[2] ? decodeURIComponent(m[2]) : "", isNew = !m[2];
      var label = isNew ? "This new item will be on" : "You are editing";
      var pair = c.all || (c.per && c.per[slug]), note = "", link = true;
      if (!pair && c.pattern) {
        pair = { en: c.pattern.en.replace("{slug}", slug), nl: c.pattern.nl.replace("{slug}", slug) };
        var st = checkPage(pair.en);
        if (st === "off") { link = false; note = c.off_note; }
        if (st === "checking") { link = false; note = "Checking whether this page is on the site..."; }
      }
      if (!pair) return '<span class="lb-label">New item:</span>' + esc(c.new_note || "its address is known after saving.");
      note = note || pair.note || "";
      var how = SAVE_NOTE + (c.new_slug && !isNew ? KEEP_NOTE + DELETE_NOTE : "");
      return '<span class="lb-label">' + label + "</span>" + addresses(pair, link) +
        (note ? '<span class="lb-note">' + esc(note) + "</span>" : "") +
        '<span class="lb-note">' + esc(how) + "</span>";
    }
    function update() {
      var html = view();
      if (html === shown) return;
      shown = html;
      bar.innerHTML = html;
      document.body.classList.toggle("lumos-bar-on", !!html);
      document.documentElement.style.setProperty("--lumos-bar-h", html ? bar.offsetHeight + "px" : "0px");
    }
    window.addEventListener("hashchange", function () { pageState = {}; update(); });
    window.addEventListener("resize", function () { shown = null; update(); });
    setInterval(update, 700); // also picks up the date and title typed into a new event
    update();
  })();

  // Less to trip over: hide the "now available on mobile" advert, and the two menu items that empty
  // or reset every box of an item at once ("Restore Default", "Clear All"). Unsaved typing can still
  // be undone with "Revert Changes", and nothing is lost until Save is clicked.
  (function () {
    var HIDE = ["Restore Default", "Clear All"];
    var queued = false;
    function tidy() {
      queued = false;
      document.querySelectorAll(".infobar").forEach(function (el) {
        if (/available on mobile/i.test(el.textContent)) el.style.display = "none";
      });
      document.querySelectorAll('[role="menuitem"]').forEach(function (el) {
        if (HIDE.indexOf(el.textContent.trim()) >= 0) el.style.display = "none";
      });
      // A group of boxes (English and Dutch, say) gets a red * from the editing screen even when
      // nothing inside it has to be filled in. Then the group's * is hidden, so * always means
      // "you cannot save without this".
      // The groups come from window.LUMOS_FREE_GROUPS (written from config.yml by req_groups.py).
      var m = location.hash.match(/^#\/collections\/([^\/?]+)\/(?:entries\/([^\/?]+)|new)/);
      var free = m && window.LUMOS_FREE_GROUPS &&
        (window.LUMOS_FREE_GROUPS[m[1] + "/" + decodeURIComponent(m[2] || "")] || window.LUMOS_FREE_GROUPS[m[1]]);
      if (!free) return;
      document.querySelectorAll("section[data-key-path]").forEach(function (sec) {
        var star = sec.querySelector(":scope > header > .required");
        var path = sec.dataset.keyPath.split(".").filter(function (p) { return !/^\d+$/.test(p); }).join(".");
        if (star && free.indexOf(path) >= 0) star.style.display = "none";
      });
    }
    new MutationObserver(function () {
      if (!queued) { queued = true; requestAnimationFrame(tidy); }
    }).observe(document.body, { childList: true, subtree: true });
  })();
</script>

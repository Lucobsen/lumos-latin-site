  - name: questions
    label: Questions
    widget: list
    required: false
    fields:
    - name: question
      label: Question
      widget: object
      fields: *english_dutch
    - name: answer
      label: Answer
      widget: object
      fields: *english_dutch_long
    summary: '{{question.en}}'
  editor:
    preview: false
- name: settings
  label: Settings
  icon: settings
  file: content/settings.json
  fields:
  - name: site_url
    label: Site address
    widget: string
    required: true
    hint: Change only when the site moves.
  - name: founded_year
    label: Year founded
    widget: number
    value_type: int
    required: true
  - name: phone
    label: Phone (as shown)
    widget: string
    required: true
  - name: tel_link
    label: Phone link
    widget: string
    required: true
  - name: whatsapp_link
    label: WhatsApp link
    widget: string
    required: true
  - name: email
    label: Email
    widget: string
    required: true
  - name: instagram
    label: Instagram
    widget: string
    required: true
  - name: tiktok
    label: TikTok
    widget: string
    required: true
  - name: facebook
    label: Facebook
    widget: string
    required: true
  - name: tryouts_on
    label: Try-out weeks are on
    widget: boolean
    required: false
    hint: 'On: the booking buttons go to each class''s try-out in Bueno and the try-out dates show. Off: every booking
      button goes to the schedule and the try-out dates are hidden.'
  - name: book_fallback
    label: Booking page
    widget: string
    required: true
  - name: buy_link
    label: Shop link
    widget: string
    required: true
  - name: hl_shape
    label: Highlight shape
    widget: select
    options:
    - A
    - B
    - C
    required: true
    hint: The shape of the coloured highlight behind headings.
  - name: hl_color
    label: Highlight colour
    widget: select
    options:
    - Pink
    - Purple
    - Lilac
    - Rose
    - Orchid
    - Moving
    required: true
  - name: btn_color
    label: Button colour
    widget: select
    options:
    - Pink
    - Purple
    required: true
  - name: q_bg
    label: Questions background
    widget: select
    options:
    - White
    - Yellow
    required: true
  - name: gtm_id
    label: Google Tag Manager code
    widget: string
    required: false
    hint: Leave empty to switch Google Tag Manager off.
  - name: google_rating
    label: Google rating
    widget: string
    required: true
    hint: e.g. 5.0
  - name: review_count
    label: Number of Google reviews
    widget: number
    value_type: int
    required: true
  - name: course_start
    label: Course start date
    widget: object
    hint: Per weekday, the first (or last) class of the current 6-week course.
    fields:
    - name: mon
      label: Monday
      widget: datetime
      type: date
      format: YYYY-MM-DD
      required: true
    - name: tue
      label: Tuesday
      widget: datetime
      type: date
      format: YYYY-MM-DD
      required: true
    - name: wed
      label: Wednesday
      widget: datetime
      type: date
      format: YYYY-MM-DD
      required: true
  - name: course_end
    label: Course end date
    widget: object
    hint: Per weekday, the first (or last) class of the current 6-week course.
    fields:
    - name: mon
      label: Monday
      widget: datetime
      type: date
      format: YYYY-MM-DD
      required: true
    - name: tue
      label: Tuesday
      widget: datetime
      type: date
      format: YYYY-MM-DD
      required: true
    - name: wed
      label: Wednesday
      widget: datetime
      type: date
      format: YYYY-MM-DD
      required: true
  editor:
    preview: false

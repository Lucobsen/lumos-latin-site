# Editing screen for lumoslatin.nl (Sveltia CMS)
#
# This file tells the editing screen at /admin/ which texts can be changed and where they are saved.
# Every change is saved straight into the content/ folder of the GitHub project. The pages of the
# site are made from those files, so a change shows on the site after the next build.
#
# Fields are listed in the same order as in the files, so saving does not shuffle them.

backend:
  name: github
  repo: Lucobsen/lumos-latin-site
  branch: main
  # GitHub sign-in goes through a small login service (sveltia-cms-auth) on the
  # Lumos Cloudflare account, worker "lumos-cms-login". After a save, the GitHub
  # action in .github/workflows/rebuild-site.yml rebuilds the pages.
  base_url: https://lumos-cms-login.blue-glade-37d7.workers.dev
app_title: Lumos Latin
logo:
  src: /assets/lumos-gem-icon.svg
# Saving publishes at once (no drafts and review step).
publish_mode: simple
# Photos live in prototype/assets/photos. Events and news store just the file name.
media_folder: prototype/assets/photos
public_folder: /assets/photos
# Every uploaded photo is shrunk in the browser before it is saved: at most 1600 pixels
# wide or high, saved as WebP at quality 82, so a 5 MB phone photo becomes about 200 KB.
# A file still over 3 MB after that is refused.
media_libraries:
  default:
    config:
      max_file_size: 3000000
      slugify_filename: true
      transformations:
        raster_image:
          format: webp
          quality: 82
          width: 1600
          height: 1600
        svg:
          optimize: true
slug:
  encoding: unicode
  clean_accents: true
  sanitize_replacement: '-'
output:
  omit_empty_optional_fields: false
  json:
    indent_style: space
    indent_size: 2
collections:
- name: events
  label: Events
  label_singular: Event
  icon: celebration
  description: Socials, workshops and game nights. Each event gets its own page. After its date, an event stays
    under Earlier until a newer one of the same kind has passed; then it leaves the site by itself.
  folder: content/events
  format: json
  extension: json
  create: true
  identifier_field: title.en
  thumbnail: image
  slug:
    template: '{{fields.date}}-{{fields.title.en}}'
    editable:
    - create
    hint: The file name, made from the date and the English title. You can change it before the first save; after
      saving it stays fixed. For an event it is also the page address.
    pattern:
    - ^[a-z0-9]+(-[a-z0-9]+)*$
    - Use only small letters, numbers and dashes, with no spaces.
  summary: '{{fields.date}} · {{fields.title.en}}'
  sortable_fields: &newest_first
    fields:
    - date
    - title.en
    default:
      field: date
      direction: descending
  fields:
  - name: kind
    label: Kind
    widget: select
    options:
    - label: Social
      value: socials
    - label: Workshop
      value: workshops
    - label: Game night
      value: game-nights
    required: true
  - name: date
    label: Date
    widget: datetime
    type: date
    format: YYYY-MM-DD
    required: true
    hint: The day of the event.
  - name: show_from
    label: Show from
    widget: datetime
    type: date
    format: YYYY-MM-DD
    required: false
    hint: First day it shows on the site. It appears by itself early that morning (by about 6:00). Leave empty to show it straight away.
  - name: hide_after
    label: Hide after
    widget: datetime
    type: date
    format: YYYY-MM-DD
    required: false
    hint: Last day it shows on the site. It disappears by itself early the next morning (by about 6:00). Leave empty to keep it.
  - name: time
    label: Time
    widget: string
    required: false
    hint: Free text, as it should show, e.g. 20:00–00:00 or 13:00–14:15 · 14:45–16:00. Leave empty if there is no
      time.
    pattern: &no_quotes_rule
    - ^[^<"]*$
    - Please leave out < and double quotes (").
  - name: title
    label: Title
    widget: object
    fields: &english_dutch_english_required_no_quotes
    - name: en
      label: English
      widget: string
      required: true
      pattern: *no_quotes_rule
    - name: nl
      label: Dutch
      widget: string
      required: false
      pattern: *no_quotes_rule
    hint: The English title also names the file.
  - name: place
    label: Place
    widget: string
    required: false
    hint: Venue and address, e.g. TG Spaces, Zeeburgerpad 22, Amsterdam. Start with the studio name so the event
      also shows on that studio's card.
    pattern: *no_quotes_rule
  - name: text
    label: Text
    widget: object
    fields: &english_dutch_long
    - name: en
      label: English
      widget: text
      required: false
    - name: nl
      label: Dutch
      widget: text
      required: false
  - name: image
    label: Photo
    widget: image
    required: false
    media_folder: /prototype/assets/photos
    public_folder: ''
    hint: Photos are kept in the site's photo folder. Leave empty for no photo.
  - name: button
    label: Button text
    widget: object
    fields: &english_dutch_no_quotes
    - name: en
      label: English
      widget: string
      required: false
      pattern: *no_quotes_rule
    - name: nl
      label: Dutch
      widget: string
      required: false
      pattern: *no_quotes_rule
    hint: Leave both empty for no button.
  - name: link
    label: Link
    widget: string
    required: false
    hint: 'Where the button goes. A full web address (https://...), or one of these short codes for a page of this
      site, typed exactly: home#start, schedule, schedule?filter=tryouts, salsa, bachata, reggaeton, #members. Type
      buy_link to use the shop link from Settings.'
  editor:
    preview: false
